spring.application.name=Calendar

server.port = 8080

# PostgreSQL Connection Settings
spring.datasource.url=jdbc:postgresql://localhost:5432/calendardb
spring.datasource.username=postgres
spring.datasource.password=password
#Yeah my password for the db is password so what ?
#And yes it is not in env because I want this to work everywhere ( I assume everyone uses password for their psw yk?)
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
